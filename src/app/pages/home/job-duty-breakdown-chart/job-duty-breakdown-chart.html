<section class="mt-6">
	<p-card class="chart-card rounded-[1.5rem] border border-slate-300/20 bg-[radial-gradient(circle_at_top_left,rgba(45,212,191,0.18),transparent_35%),linear-gradient(135deg,#0f172a_0%,#134e4a_45%,#0f766e_100%)] shadow-[0_24px_55px_rgba(15,23,42,0.2)]">
		<div class="flex min-h-[28rem] flex-col gap-4">
			<div class="flex flex-wrap items-start justify-between gap-3">
				<div>
					<p class="m-0 text-[0.9rem] font-bold uppercase tracking-[0.08em] text-teal-100/80">Job breakdown</p>
					<h2 class="mt-2 text-[clamp(1.4rem,2.6vw,2rem)] font-extrabold leading-tight text-slate-50">Jobs played by duty type</h2>
					<p class="mt-2 max-w-[42rem] text-[0.98rem] leading-6 text-slate-100/82">
						Each played job is sorted by total duties run, with the duty types stacked across the x axis.
					</p>
				</div>
				<p-tag severity="success" value="Sorted by total duties"></p-tag>
			</div>

			@if (isLoading()) {
				<div class="chart-panel mt-2">
					<p-skeleton width="100%" height="24rem"></p-skeleton>
				</div>
			} @else if (chartData(); as currentChartData) {
				<div class="chart-panel mt-2" [style.height.px]="chartHeight()">
					<p-chart
						type="bar"
						[data]="currentChartData"
						[options]="chartOptions()"
						[plugins]="chartPlugins()"
						class="block h-full w-full"
					></p-chart>
				</div>
			} @else {
				<div class="chart-panel flex items-center justify-center rounded-[1.25rem] border border-dashed border-white/15 bg-white/6 px-6 py-8 text-center">
					<p class="m-0 max-w-[30rem] text-[0.98rem] leading-6 text-slate-100/82">
						No played job history is available for this chart yet.
					</p>
				</div>
			}
		</div>
	</p-card>
</section>
