<p-dialog
	modal="true"
	[(visible)]="visible"
	(visibleChange)="visibleChange.emit($event)"
	[header]="isNew ? 'Add New Duty' : 'Edit Duty'"
	[style]="{width: '350px'}">

	@if (duty != null) {
		<div class="flex flex-col gap-4" style="height: 350px">
			<input
				type="text"
				pInputText
				[formControl]="$any(form.get('name'))"
				placeholder="Duty Name" />

			<p-select
				[options]="dutyTypes"
				[formControl]="$any(form.get('dutyType'))"
				placeholder="Duty Type" />

			<p-select
				[options]="expansions"
				[formControl]="$any(form.get('expansion'))"
				[disabled]="isExpansionDisabled"
				placeholder="Expansion" />

			<input
				type="number"
				pInputText
				[formControl]="$any(form.get('levelRequirement'))"
				placeholder="Level Requirement" />

			@if (isLevelOutOfRange && hasExpansion && levelRange && duty.expansion !== undefined && duty.expansion !== null) {
				<small class="p-error" style="font-size: 0.75rem">
					Level must be between {{ levelRange.min }} and {{ levelRange.max }} for {{ expansionLabels[duty.expansion] }}
				</small>
			}
		</div>

		<div class="mt-4 flex justify-end gap-4">
			<button
				pButton
				label="Cancel"
				icon="pi pi-times"
				size="small"
				class="p-button-secondary"
				(click)="visibleChange.emit(false); visible = false"></button>

			<button
				pButton
				label="Save"
				icon="pi pi-check"
				size="small"
				[class.p-button-loading]="isLoading"
				[disabled]="!form.valid || isLoading"
				(click)="onSave()"></button>
		</div>
	}
</p-dialog>
